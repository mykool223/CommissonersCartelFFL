# Run with: swiftlint  (brew install swiftlint)
# CI treats violations as warnings, not build failures — style should not block
# a fix from landing.

included:
  - App
  - Packages/CartelKit/Sources
  - Packages/CartelKit/Tests

excluded:
  - .build
  - Packages/CartelKit/.build
  - DerivedData

disabled_rules:
  # SwiftUI view bodies are legitimately deeply nested.
  - multiple_closures_with_trailing_closure
  # Fires constantly on SwiftUI modifier chains.
  - line_length

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing
  - toggle_bool
  - unused_import

force_unwrapping:
  severity: warning

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 900

function_body_length:
  warning: 80
  error: 150

identifier_name:
  # Row types mirror Postgres column names, which are snake_case.
  excluded:
    - id
    - to
    - at

cyclomatic_complexity:
  warning: 12
