<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- The same face the league's other avatars wear: gold on black, ringed. -->
  <circle cx="12" cy="12" r="11.3" fill="#0B0B0B"/>
  <circle cx="12" cy="12" r="11.3" fill="none" stroke="#D4AF52" stroke-width="1.4"/>
  <g transform="translate(12 12) scale(0.62) translate(-12 -12)" fill="#D4AF52">
    <!-- fedora crown -->
    <path d="M7.4,9.0 C7.4,4.4 8.8,2.2 12,2.2 C15.2,2.2 16.6,4.4 16.6,9.0 Z"/>
    <!-- brim -->
    <path d="M2.6,11.2 a9.4,2.0 0 1 0 18.8,0 a9.4,2.0 0 1 0 -18.8,0 z"/>
    <!-- collar -->
    <path d="M8.4,14.6 L10.2,14.2 L12,16.1 L13.8,14.2 L15.6,14.6 L15.6,16.4
             L13.9,16.2 L12,17.6 L10.1,16.2 L8.4,16.4 Z"/>
    <!-- tie knot -->
    <path d="M10.3,15.8 L13.7,15.8 L14.1,18.2 L9.9,18.2 Z"/>
    <!-- tie blade -->
    <path d="M10.2,18.6 L13.8,18.6 L12.9,21.7 L12,22.7 L11.1,21.7 Z"/>
  </g>
</svg>
