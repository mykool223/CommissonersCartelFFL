<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- fedora crown: taller than a cap, with the sides pinched in -->
  <path d="M7.7,9.4 C7.7,4.6 9.1,2.4 12,2.4 C14.9,2.4 16.3,4.6 16.3,9.4 Z" fill="currentColor"/>
  <!-- brim; the gap above it reads as the band -->
  <path d="M3.0,11.4 a9.0,1.9 0 1 0 18.0,0 a9.0,1.9 0 1 0 -18.0,0 z" fill="currentColor"/>
  <!-- collar, opened around the knot -->
  <path d="M8.4,14.6 L10.2,14.2 L12,16.1 L13.8,14.2 L15.6,14.6 L15.6,16.4 L13.9,16.2 L12,17.6 L10.1,16.2 L8.4,16.4 Z" fill="currentColor"/>
  <!-- tie knot, chunky enough to survive being drawn at 20pt -->
  <path d="M10.3,15.8 L13.7,15.8 L14.1,18.2 L9.9,18.2 Z" fill="currentColor"/>
  <!-- tie blade -->
  <path d="M10.2,18.6 L13.8,18.6 L12.9,21.7 L12,22.7 L11.1,21.7 Z" fill="currentColor"/>
</svg>
