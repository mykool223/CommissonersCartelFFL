name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: CartelKit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      # Runs on macOS rather than a simulator: CartelKit is platform-agnostic,
      # so this is the fast feedback loop. The iOS build below is what proves
      # the app target compiles.
      - name: Run tests
        working-directory: Packages/CartelKit
        run: swift test --parallel

  ios-build:
    name: Build iOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      # project.yml is the source of truth. Regenerating here means a PR that
      # edits the spec without committing the regenerated project is caught.
      - name: Check the committed project matches project.yml
        run: |
          xcodegen generate --spec project.yml
          if ! git diff --quiet -- CommissionersCartel.xcodeproj; then
            echo "::error::CommissionersCartel.xcodeproj is out of date."
            echo "Run ./Scripts/generate.sh and commit the result."
            git diff --stat -- CommissionersCartel.xcodeproj
            exit 1
          fi

      # 'generic/platform=iOS Simulator' rather than a named device: runner
      # images rotate which simulators they ship, and pinning to one means the
      # build breaks on a device name rather than on the code.
      - name: Build
        run: |
          xcodebuild build \
            -project CommissionersCartel.xcodeproj \
            -scheme CommissionersCartel \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

  # Ubuntu, not macOS: this needs no Xcode, and Linux runners bill at 1x
  # against 10x for macOS.
  database:
    name: Database schema and security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      # Applies every migration to a real Postgres and asserts the properties
      # the app depends on but cannot enforce itself: non-members see nothing,
      # re-voting cannot inflate a tally, anon cannot reach the RPCs.
      - name: Apply migrations and check security expectations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: ./Scripts/test-database.sh

  # Ubuntu for the same reason as the database job: no Xcode needed, and
  # Linux runners bill at 1x against macOS's 10x.
  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/libs.versions.toml', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-

      # No secrets.properties in CI. The build is expected to succeed without
      # it — the app falls back to sample data — and that is worth proving,
      # because a fresh clone is in exactly this state.
      - name: Build and test
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # The lineup solver is the one script that can be subtly wrong while
      # looking right, so its cases run on every push. The FantasyPros sync
      # joins it: overspending their daily call allowance locks the key out
      # until midnight, and that guard is worth keeping honest.
      - name: Run script tests
        run: |
          ./Scripts/test_lineup_coach.py
          ./Scripts/test_sync_fantasypros.py
          ./Scripts/test_trade_finder.py

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: brew install swiftlint
      # Style should not block a fix from landing, so this reports but does not fail.
      - name: Lint
        run: swiftlint lint --reporter github-actions-logging || true
