# Pulls player news and analysis from FantasyPros.
#
# One call per run, sharing the same hundred-a-day allowance as the rankings
# sync — which is read before starting rather than assumed. Six runs a day
# keeps the feed current without spending much of it.
name: Sync FantasyPros news

on:
  schedule:
    # Every four hours.
    - cron: "15 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and print, without writing"
        type: boolean
        default: true

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          if [ -z "$FANTASYPROS_API_KEY" ]; then
            echo "No FantasyPros key is set; nothing to fetch."
            exit 0
          fi
          ./Scripts/sync_fantasypros_news.py
