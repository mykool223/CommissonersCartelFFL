# Pulls player news from The Fantasy Footballers into Supabase.
#
# Their news page renders server-side and carries everything in one document —
# player, position, team, headshot, timestamp, headline and blurb — so each run
# is a single request, not a crawl. The bot identifies itself honestly and
# their robots.txt permits it.
#
# Runs through the day rather than once each morning. Pull-to-refresh in the
# app re-reads this table, so a daily job meant pulling produced the same list
# every time after breakfast — injury news does not keep office hours, and
# Sunday morning is exactly when somebody wants it.
#
# Stores the short factual blurb only; their longer analysis paragraph on each
# item is deliberately skipped, and every row keeps its source URL.
#
# This also keeps the Supabase project awake: a daily write is activity, so the
# free tier's one-week inactivity pause never triggers during the offseason.
# keep-supabase-awake.yml stays as a fallback for when no news lands.
name: Ingest news

on:
  schedule:
    # Every half hour through waking hours — 10:00-04:00 UTC is 5am to 11pm
    # Central — and hourly overnight, so nothing that breaks at 2am waits
    # until morning. About 43 requests a day against a page served from a
    # cache.
    #
    # GitHub's scheduler is best-effort and runs late under load; nothing here
    # depends on the exact minute.
    - cron: "0,30 10-23 * * *"
    - cron: "0,30 0-4 * * *"
    - cron: "0 5-9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Parse the page and print what would be stored, without writing"
        type: boolean
        default: false

jobs:
  ingest:
    name: Fetch and store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Writes bypass row level security by design: external_articles has
          # no insert policy, so nothing carrying the anon key can write here.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          if [ -z "$SUPABASE_URL" ] && [ -z "$DRY_RUN" ]; then
            echo "Supabase secrets are not set; nothing to ingest into."
            exit 0
          fi
          ./Scripts/ingest_news.py
      # Straight after, so an alert goes out with the story that caused it
      # rather than waiting for a job on its own schedule.
      - name: Alert on roster news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          if [ -z "$ESPN_S2" ]; then
            echo "ESPN secrets are not set; nobody to match news against."
            exit 0
          fi
          ./Scripts/roster_news.py
