# Caches FantasyPros consensus rankings and projections for Coach Landry.
#
# Their licence allows 100 calls a day in total and asks that clients cache
# rather than poll, so this is the only thing in the project that calls them.
# Everything else reads the tables it fills.
#
# Nightly, after the practice reports and rankings have settled for the day.
name: Sync FantasyPros

on:
  schedule:
    # 09:00 UTC — around 4am Central, well clear of the other jobs.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      week:
        description: "Force a week (defaults to the current one)"
        type: string
      debug:
        description: "Log the shape of what FantasyPros returns"
        type: boolean
        default: false
      dry_run:
        description: "Fetch and report, without writing"
        type: boolean
        default: true

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
          FP_WEEK: ${{ inputs.week }}
          FP_DEBUG: ${{ inputs.debug && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          if [ -z "$FANTASYPROS_API_KEY" ]; then
            echo "No FantasyPros key is set; the coach falls back to ESPN alone."
            exit 0
          fi
          ./Scripts/sync_fantasypros.py
