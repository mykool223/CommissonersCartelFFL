# Landry's Tuesday post-mortem: one private message to each manager about the
# week just gone, and the one thing that would have changed it.
#
# Separate from his rounds on purpose. The rounds are about what to do next —
# a signing, a trade, a starter who may not play. This is about what already
# happened, and mixing the two would make both easier to ignore.
name: Landry's recaps

on:
  schedule:
    # Tuesday afternoon in Chicago. Four candidate firings, none on the hour.
    #
    # GitHub's cron is not a clock: it drops scheduled runs under load —
    # minute 0 worst of all — and delays the rest. The first attempt at this
    # was scheduled at 19:00 and 20:00 UTC; the first was dropped outright and
    # the second arrived 114 minutes late, at which point it was no longer the
    # afternoon and nobody got anything.
    #
    # Whichever firing lands first inside the window does the work. The others
    # find it already done and send nothing, because what prevents a second
    # message is the record of the first, not the time of day.
    - cron: "7 19,20,21,22 * * 2"
  workflow_dispatch:
    inputs:
      week:
        description: "Force a week (defaults to the last finished one)"
        type: string
      ignore_clock:
        description: "Run now, whatever the time is in Chicago"
        type: boolean
        default: true
      only:
        description: "Send to this manager alone (display name)"
        type: string
      resend:
        description: "Send again to somebody who already has this week's"
        type: boolean
        default: false
      dry_run:
        description: "Print what he would send, without sending"
        type: boolean
        default: true

jobs:
  recaps:
    name: Recaps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Recaps
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          RECAP_WEEK: ${{ inputs.week }}
          RECAP_IGNORE_CLOCK: ${{ inputs.ignore_clock && '1' || '' }}
          RECAP_ONLY: ${{ inputs.only }}
          RECAP_RESEND: ${{ inputs.resend && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          if [ -z "$ESPN_S2" ]; then
            echo "ESPN secrets are not set; nothing to review."
            exit 0
          fi
          ./Scripts/landry_recaps.py
