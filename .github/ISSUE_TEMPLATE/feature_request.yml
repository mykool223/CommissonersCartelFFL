name: Feature request
description: Suggest something the app should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem
      description: What are you trying to do that the app makes hard today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you'd like instead
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app
      options:
        - News
        - Matchups
        - Polls
        - Members
        - Settings
        - Something new
    validations:
      required: true
