name: Bug report
description: Something in the app is broken
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Polls tab
        2. Tap an option
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where in the app
      options:
        - News
        - Matchups
        - Polls
        - Members
        - Settings
        - Somewhere else / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version and iOS version
      placeholder: "0.1.0 (1), iOS 18.2"

  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console output
