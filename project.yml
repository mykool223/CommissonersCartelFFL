# Source of truth for CommissionersCartel.xcodeproj.
#
# The .xcodeproj IS committed, so the repo opens in Xcode with no extra tools.
# But edit THIS file, not the project, then run `./Scripts/generate.sh`.
# A YAML file produces readable diffs and merges; a pbxproj does not.

name: CommissionersCartel

options:
  bundleIdPrefix: com.commissionerscartel
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.38.0"

configs:
  Debug: debug
  Release: release

# Build settings, versions and the ESPN/Supabase values all come from
# Config/*.xcconfig so they can be changed without regenerating the project.
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    # Full Swift 6 language mode: data-race safety is enforced at compile time,
    # not merely warned about. CartelKit and the app target both build clean
    # under it. Keep it here — dropping to 5.0 would silently downgrade every
    # concurrency error to a warning.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES

packages:
  CartelKit:
    path: Packages/CartelKit

targets:
  CommissionersCartel:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: App/CommissionersCartel
        excludes:
          # Referenced via INFOPLIST_FILE; must not also be copied as a resource.
          - "Resources/Info.plist"
          # Referenced via CODE_SIGN_ENTITLEMENTS, same reason.
          - "Resources/CommissionersCartel.entitlements"
          - "Resources/CommissionersCartelRelease.entitlements"
    dependencies:
      - package: CartelKit
        product: CartelCore
      - package: CartelKit
        product: CartelESPN
      - package: CartelKit
        product: CartelSupabase
      # Embeds the home screen widget.
      - target: CartelWidget
    settings:
      base:
        INFOPLIST_FILE: App/CommissionersCartel/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone and iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # Comes from Config/Secrets.xcconfig, which is gitignored. Empty builds
        # fine for the simulator; a device or TestFlight build needs it.
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        SUPPORTS_MACCATALYST: NO
      configs:
        # Push entitlements differ per configuration: a token minted against
        # Apple's sandbox is rejected by the production hosts and vice versa.
        # Setting one file for both configurations makes -exportArchive drop
        # aps-environment entirely, producing an upload that looks fine and
        # never delivers a notification.
        Debug:
          CODE_SIGN_ENTITLEMENTS: App/CommissionersCartel/Resources/CommissionersCartel.entitlements
        # Left to automatic signing on purpose. With CODE_SIGN_STYLE=Automatic,
        # the archive is signed for *development* and -exportArchive re-signs it
        # for distribution — so pinning CODE_SIGN_IDENTITY to "Apple
        # Distribution" here makes xcodebuild refuse with a conflicting-settings
        # error rather than helping.
        Release:
          CODE_SIGN_ENTITLEMENTS: App/CommissionersCartel/Resources/CommissionersCartelRelease.entitlements
    scheme:
      gatherCoverageData: true
      environmentVariables:
        # Keeps SwiftUI preview and console output readable.
        OS_ACTIVITY_MODE: disable

  # The home screen widget. A separate process with no session of its own, so
  # it learns which team is yours through the shared app group and fetches
  # everything else itself.
  CartelWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/CartelWidget
        excludes:
          - "Info.plist"
          - "CartelWidget.entitlements"
          - "CartelWidgetRelease.entitlements"
      # Compiled into both targets rather than duplicated: if the two ever
      # disagreed about the app group name, the widget would silently show
      # nothing and there would be no error to find.
      - path: Shared
    dependencies:
      - package: CartelKit
        product: CartelCore
      - package: CartelKit
        product: CartelESPN
    settings:
      base:
        INFOPLIST_FILE: Widget/CartelWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.commissionerscartel.app.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Widget/CartelWidget/CartelWidget.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Widget/CartelWidget/CartelWidgetRelease.entitlements

# Note: CartelKit's tests are deliberately NOT wired into the scheme here.
# `scheme.testTargets: [{package: CartelKit}]` crashes XcodeGen 2.46.0 with a
# SIGTRAP and no diagnostic. To run them in Xcode, open Product > Scheme >
# Edit Scheme > Test > + and add the CartelKit test targets once; the change
# lives in xcshareddata and survives regeneration. From the terminal, use
# ./Scripts/test-package.sh, which needs no Xcode at all.
